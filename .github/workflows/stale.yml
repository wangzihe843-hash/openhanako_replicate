name: Stale Issues

# 自动标记长期不活跃的 issue 并提醒，不自动关闭。
# Automatically marks long-inactive issues and sends reminders, without closing them.
#
# 工作方式 / How it works
#   issue 30 天无任何活动 → 打上 `stale` 标签并留言提醒。
#   After 30 days with no activity, add the `stale` label + a comment.
#   即使持续不活跃或已带有 `stale` 标签，也不会自动关闭。
#   Issues will not be closed automatically, even if they remain inactive or are already stale.
#   任何新评论/更新都会自动移除 `stale` 标签并重新计时（remove-stale-when-updated）。
#   Any comment/update removes the `stale` label and resets the clock.
#
# 分批提醒 / Batched reminders:
#   operations-per-run 限流让冷 issue 分批、逐日标记（从最旧的开始），避免一次性刷屏通知。
#   The operations-per-run cap spreads labeling over several days (oldest first)
#   instead of flooding notifications in one run.
#
# 只处理 issue，不处理 PR：本仓库的 PR 已由 close-prs.yml 在打开时自动关闭。
# Issues only — PRs are already auto-closed on open by close-prs.yml.
#
# 预演 / Dry run: 手动触发 (Actions → Stale Issues → Run workflow) 并勾选
# dry_run，只在日志里打印会被处理的 issue，不做任何修改。
# Trigger manually with dry_run=true to log what would happen without changing anything.

on:
  schedule:
    # 每天 01:30 UTC（新加坡/北京时间 09:30）/ daily at 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — only log what would be marked/reminded, make no changes"
        required: false
        type: boolean
        default: true

permissions:
  issues: write
  # actions/stale 用 Actions 缓存保存跨运行的处理进度（分批续跑需要）
  # actions/stale persists its progress in the Actions cache between runs
  actions: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- 时间阈值 / Thresholds ----
          days-before-issue-stale: 30
          # 仅提醒，不自动关闭（actions/stale 支持 -1 禁用关闭）
          # Reminders only; -1 disables automatic closing in actions/stale
          days-before-issue-close: -1
          # 不处理 PR / never touch PRs
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # ---- 标签 / Labels ----
          stale-issue-label: stale
          remove-stale-when-updated: true

          # ---- 豁免 / Exemptions ----
          # 带以下任一标签的 issue 永不标记（不存在的标签会被安全忽略）
          # Issues with any of these labels are never marked (missing labels are ignored)
          exempt-issue-labels: "pinned,security,good first issue,help wanted,starred"
          # 已分配负责人或已挂里程碑的 issue 视为在跟进中
          # Assigned or milestoned issues are considered actively tracked
          exempt-all-issue-assignees: true
          exempt-all-issue-milestones: true

          # ---- 限流 / Rate limiting ----
          # 每次运行最多 100 次 API 操作；~1100 个 open issue 会在数天内分批处理，
          # 从最旧的开始。/ Cap API operations per run; backlog is processed in
          # batches over several days, oldest first.
          operations-per-run: 100
          ascending: true

          # 定时运行为正式模式；手动触发默认 dry run
          # Scheduled runs are live; manual runs default to dry run
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

          # ---- 留言模板 / Comment templates ----
          stale-issue-message: |
            这个 issue 已经 30 天没有任何动态，已被自动标记为 `stale`。
            这只是一次过期提醒，本工作流不会自动关闭这个 issue。

            如果问题仍然存在或需求仍然有意义，欢迎在下面留言补充最新情况。新评论或更新会自动移除 `stale` 标签并重新计时。
            感谢你的反馈！

            ---

            This issue has had no activity for 30 days and has been automatically marked as `stale`.
            This is only an inactivity reminder; this workflow will not close this issue automatically.

            If the issue is still relevant, feel free to leave an update below. A new comment or update will automatically remove the `stale` label and reset the timer.
            Thanks for the feedback!
