name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-kimi-context-diagnostic-20261015
  cancel-in-progress: false

jobs:
  windows-kimi-context-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/windows-kimi-context-20261015'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
      - name: Verify immutable diagnostic scope
        run: node scripts/diagnose-windows-kimi-context.mjs --check-scope
      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Run fixed Windows diagnostic budget
        timeout-minutes: 9
        run: node scripts/diagnose-windows-kimi-context.mjs --run
      - name: Upload allowlisted diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-kimi-context-diagnostic
          path: |
            ${{ runner.temp }}/kimi-context-diagnostic/safe/*.json
            ${{ runner.temp }}/kimi-context-diagnostic/safe/*.jsonl
          if-no-files-found: error
          retention-days: 3
